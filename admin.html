
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdVibe Owner Panel</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0f1a;color:white;
 font-family:Arial,sans-serif;padding:30px 15px
}
.container{max-width:700px;margin:50px auto}
.card{
 background:#131a2c;border:1px solid #232c44;
 border-radius:18px;padding:25px;margin:20px 0
}
h1{color:#7c5cff}
input{
 width:100%;padding:14px;margin:10px 0;
 background:#0b0f1a;border:1px solid #39425c;
 border-radius:8px;color:white
}
button{
 padding:13px 22px;border:0;border-radius:25px;
 background:linear-gradient(90deg,#7c5cff,#00d4ff);
 font-weight:bold;cursor:pointer;margin:5px
}
.hidden{display:none}
p{color:#a9b1c9}
video{width:100%;border-radius:12px;background:#080b12}
</style>
</head>
<body>
<div class="container">
<h1>AdVibe Owner Panel</h1>

<div class="card" id="login">
<h2>Owner Login</h2>
<input id="email" type="email" placeholder="Owner Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Welcome, Owner!</h2>
<p>Private testing dashboard</p>
<button id="logoutBtn">Logout</button>
</div>

<div class="card">
<h2>Camera Tester</h2>
<p>Camera preview on your own device, with permission.</p>
<video id="video" autoplay muted playsinline></video>
<br>
<button id="startCamera">Start Camera</button>
<button id="stopCamera">Stop Camera</button>
</div>

<div class="card">
<h2>Location Tester</h2>
<p>Test your own device location with permission.</p>
<button id="locationBtn">Check My Location</button>
<p id="locationResult"></p>
</div>
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAy9V_jxmxy5ViP93mdGYp1SYfMZuU_H-M",
 authDomain:"advice-ac549.firebaseapp.com",
 projectId:"advice-ac549",
 storageBucket:"advice-ac549.firebasestorage.app",
 messagingSenderId:"540877111141",
 appId:"1:540877111141:web:296b92636ebab2ab916b8c",
 measurementId:"G-R7W4DDQYKJ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const login=document.getElementById("login");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

async function checkOwner(user){
 login.classList.add("hidden");
 dashboard.classList.add("hidden");

 if(!user){
  login.classList.remove("hidden");
  return;
 }

 try{
  const ref=doc(db,"adminUsers",user.uid);
  const snap=await getDoc(ref);

  if(snap.exists() && snap.data().role==="owner"){
   dashboard.classList.remove("hidden");
  }else{
   await signOut(auth);
   login.classList.remove("hidden");
   message.textContent="Access denied: Owner only.";
  }
 }catch(error){
  await signOut(auth);
  login.classList.remove("hidden");
  message.textContent="Authorization error: "+error.message;
 }
}

onAuthStateChanged(auth,checkOwner);

document.getElementById("loginBtn").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   document.getElementById("email").value,
   document.getElementById("password").value
  );
  message.textContent="Checking owner access...";
 }catch(error){
  message.textContent="Login failed: "+error.message;
 }
};

document.getElementById("logoutBtn").onclick=()=>{
 signOut(auth);
 stopCamera();
};

let stream=null;

async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:true,audio:false
  });
  document.getElementById("video").srcObject=stream;
 }catch(error){
  alert("Camera permission denied or unavailable.");
 }
}

function stopCamera(){
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 document.getElementById("video").srcObject=null;
}

document.getElementById("startCamera").onclick=startCamera;
document.getElementById("stopCamera").onclick=stopCamera;

document.getElementById("locationBtn").onclick=()=>{
 navigator.geolocation.getCurrentPosition(
  pos=>{
   const lat=pos.coords.latitude;
   const lon=pos.coords.longitude;

   document.getElementById("locationResult").innerHTML=
   `Latitude: ${lat}<br>Longitude: ${lon}<br>
   <a style="color:#00d4ff" target="_blank" rel="noopener"
   href="https://maps.google.com/?q=${lat},${lon}">
   View on Google Maps</a>`;
  },
  error=>{
   document.getElementById("locationResult").textContent=
   error.message;
  }
 );
};
</script>
</body>
</html>
